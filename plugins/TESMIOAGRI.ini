; TESMIOAGRI 0.1.0 / SOVIET64.exe 1.1.1.9 only
; Restart the game through TESMIO after changing this file.
[agriculture]
enabled = 1

; Positive growth duration relative to the original, under the same climate.
; 1 = original, 0.5 = about half the growth wait, 0.25 = about one quarter.
; 2 = about twice the wait. Range: 0.1 .. 10.0. Cold decay is not scaled.
; Not a fixed number of days; sowing, harvesting and seasons still apply.
maturity_time_scale = 1.0

; Newly harvested crops only, for BOTH manual and mechanical harvesting.
; 1 = original, 2 = twice, 0.5 = half. Range: 0.1 .. 10.0.
; Existing inventory is not multiplied; this does not change storage capacity.
yield_multiplier = 1.0
